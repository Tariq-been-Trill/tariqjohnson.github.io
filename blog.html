<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>the void.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --onyx:#08090A; --pearl:#EDE9E1; --muted:#6E7274; --white:#FFFFFF;
    --hairline:rgba(237,233,225,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--onyx); }
  body{
    font-family:'JetBrains Mono',monospace; color:var(--pearl); line-height:1.6;
    padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  }
  .head{ text-align:center; padding:56px 24px 28px; }
  .head h1{ margin:0 0 10px; font-weight:500; font-size:clamp(28px,8vw,42px); letter-spacing:.02em; }
  .head p{ margin:0; font-size:13px; color:var(--muted); }

  .filters{ max-width:640px; margin:0 auto; padding:0 24px 40px; display:flex; flex-direction:column; gap:14px; }
  .search{
    width:100%; padding:12px 16px; font:inherit; font-size:14px; color:var(--pearl);
    background:rgba(237,233,225,.05); border:1px solid var(--hairline); outline:none; border-radius:0;
  }
  .search:focus{ border-color:var(--white); }
  .search::placeholder{ color:var(--muted); }
  .chips{ display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; min-height:18px; }
  .chip{ color:var(--muted); cursor:pointer; user-select:none; background:none; border:0; padding:0; font:inherit; }
  .chip:hover{ color:var(--pearl); }
  .chip.active{ color:var(--white); text-decoration:underline; text-underline-offset:4px; }

  /* every post: same full-width frame, same treatment */
  .post{ margin:0 0 72px; }
  .post.hidden{ display:none; }
  .frame{ width:100%; aspect-ratio:3/2; background:#111; overflow:hidden; }
  .frame img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(.92) contrast(1.03);
    opacity:0; transition:opacity .8s ease;
  }
  .frame img.loaded{ opacity:1; }
  .body{ max-width:640px; margin:0 auto; padding:28px 24px 0; }
  .text{ font-size:14px; line-height:1.8; white-space:pre-wrap; overflow-wrap:break-word; margin:0 0 22px; }
  .meta{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11px; color:var(--muted); letter-spacing:.02em; }
  .meta .date{ color:var(--pearl); }
  .meta .tag{ cursor:pointer; background:none; border:0; padding:0; font:inherit; color:var(--muted); }
  .meta .tag:hover{ color:var(--white); }

  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:24px; }
  .exit{
    display:block; width:max-content; margin:0 auto; padding-top:24px;
    color:var(--white); text-decoration:none; font-size:13px; letter-spacing:.04em;
  }
  .exit:hover{ opacity:.7; }
</style>
</head>
<body>

  <header class="head">
    <h1>The Void</h1>
    <p>thoughts, ideas, poems</p>
  </header>

  <div class="filters">
    <input class="search" id="search" type="text" placeholder="search by tag: poems, thoughts, september, 2026..." autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>

  <main id="feed"></main>

  <a class="exit" href="index.html">Exit the Void</a>

  <script src="posts.js"></script>
  <script>
    const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    const feed = document.getElementById('feed');
    const chipsEl = document.getElementById('chips');
    const search = document.getElementById('search');

    // newest first, with month + year tags added automatically
    const posts = [...window.POSTS].sort((a,b) => b.date.localeCompare(a.date)).map(p => {
      const [y,m,d] = p.date.split('-').map(Number);
      const month = MONTHS[m-1];
      const tags = [...new Set([...(p.tags||[]), month, String(y)].map(t => t.toLowerCase()))];
      return { ...p, tags, label: `${month} ${d}, ${y}` };
    });

    const allTags = [...new Set(posts.flatMap(p => p.tags))].sort();
    const active = new Set();
    let typed = [];

    function el(tag, cls, text){
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    const nodes = posts.map(p => {
      const art = el('article','post');
      if (p.image){
        const frame = el('div','frame');
        const img = new Image();
        img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
        img.onload = () => img.classList.add('loaded');
        img.src = p.image;
        frame.appendChild(img);
        art.appendChild(frame);
      }
      const body = el('div','body');
      body.appendChild(el('p','text', p.text));
      const meta = el('div','meta');
      meta.appendChild(el('span','date', p.label));
      p.tags.forEach(t => {
        const b = el('button','tag', t);
        b.type = 'button';
        b.onclick = () => { active.clear(); active.add(t); update(); window.scrollTo({top:0,behavior:'smooth'}); };
        meta.appendChild(b);
      });
      body.appendChild(meta);
      art.appendChild(body);
      feed.appendChild(art);
      return { art, tags: p.tags };
    });

    const none = el('div','empty','no entries found with those tags');
    none.hidden = true;
    feed.appendChild(none);

    function renderChips(){
      chipsEl.textContent = '';
      allTags.forEach(t => {
        const b = el('button','chip' + (active.has(t) ? ' active' : ''), t);
        b.type = 'button';
        b.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); update(); };
        chipsEl.appendChild(b);
      });
    }

    function update(){
      let shown = 0;
      nodes.forEach(n => {
        const ok = [...active].every(t => n.tags.includes(t)) &&
                   typed.every(q => n.tags.some(t => t.startsWith(q)));
        n.art.classList.toggle('hidden', !ok);
        if (ok) shown++;
      });
      none.hidden = shown > 0;
      renderChips();
    }

    search.addEventListener('input', e => {
      typed = e.target.value.toLowerCase().split(/[,\s]+/).filter(Boolean);
      update();
    });

    update();
  </script>
</body>
</html>
