<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Void - Tariq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --onyx: #08090A;
      --pearl: #EDE9E1;
      --muted: #6E7274;
      --gold: #C6A15B;
      --gold-bright: #E0BE7E;
      --hairline: rgba(237,233,225,0.10);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--onyx);
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      font-family: 'JetBrains Mono', monospace;
      color: var(--pearl);
      padding: 24px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 48px;
      text-align: center;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 24px;
    }

    .header h1 {
      font-size: clamp(28px, 8vw, 42px);
      margin: 0 0 12px 0;
      letter-spacing: 0.02em;
      font-weight: 500;
    }

    .header p {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
      letter-spacing: 0.01em;
    }

    .search-bar {
      width: 100%;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      background: rgba(237,233,225,0.05);
      border: 1px solid var(--hairline);
      color: var(--pearl);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      background: rgba(237,233,225,0.08);
      border-color: var(--gold);
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .tags-display {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    .tag {
      display: inline-block;
      background: rgba(198,161,91,0.15);
      color: var(--gold);
      padding: 2px 8px;
      margin-right: 6px;
      margin-bottom: 4px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .tag:hover {
      background: rgba(198,161,91,0.25);
      color: var(--gold-bright);
    }

    .tag.active {
      background: var(--gold);
      color: var(--onyx);
    }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .entry {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--hairline);
      transition: opacity 0.3s ease;
    }

    .entry.hidden {
      display: none;
    }

    .entry-date {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .entry-content {
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .entry-tags {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .entry-tag {
      display: inline-block;
      background: rgba(198,161,91,0.1);
      color: var(--gold);
      padding: 2px 6px;
      margin-right: 4px;
      margin-bottom: 2px;
      border-radius: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .entry-tag:hover {
      background: rgba(198,161,91,0.2);
      color: var(--gold-bright);
    }

    .no-results {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 0;
      opacity: 0.7;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--hairline);
      text-decoration: none;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--gold-bright);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>The Void</h1>
      <p>thoughts, ideas, and musings from the void</p>
    </div>

    <div class="search-bar">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="search by tag: ramble, thoughts, september, 2026..."
      >
      <div id="tagsDisplay" class="tags-display"></div>
    </div>

    <div class="entries" id="entries">
      <!-- Entry template (copy this block and modify to add new entries):
      <article class="entry" data-tags="september, 2026, thoughts">
        <div class="entry-date">september 6, 2026</div>
        <div class="entry-content">Your thoughts go here.</div>
        <div class="entry-tags">
          <span class="entry-tag" data-tag="september">september</span>
          <span class="entry-tag" data-tag="2026">2026</span>
          <span class="entry-tag" data-tag="thoughts">thoughts</span>
        </div>
      </article>
      -->

      <article class="entry" data-tags="september, 2026, thoughts">
        <div class="entry-date">september 6, 2026</div>
        <div class="entry-content">stepping into the void with intention. everything starts here.</div>
        <div class="entry-tags">
          <span class="entry-tag" data-tag="september">september</span>
          <span class="entry-tag" data-tag="2026">2026</span>
          <span class="entry-tag" data-tag="thoughts">thoughts</span>
        </div>
      </article>

    </div>

    <a href="index.html" class="back-link">back to intro</a>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const tagsDisplay = document.getElementById('tagsDisplay');
    const entriesContainer = document.getElementById('entries');
    const entries = document.querySelectorAll('.entry');

    let activeTags = new Set();
    let allTags = new Set();

    // Build set of all available tags
    entries.forEach(entry => {
      const tags = entry.getAttribute('data-tags');
      if (tags) {
        tags.split(',').forEach(tag => {
          allTags.add(tag.trim().toLowerCase());
        });
      }
    });

    // Populate tags display
    function renderTags() {
      tagsDisplay.innerHTML = '';
      Array.from(allTags).sort().forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag' + (activeTags.has(tag) ? ' active' : '');
        span.textContent = tag;
        span.addEventListener('click', () => toggleTag(tag));
        tagsDisplay.appendChild(span);
      });
    }

    function toggleTag(tag) {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
      } else {
        activeTags.add(tag);
      }
      filterEntries();
      renderTags();
    }

    function filterEntries() {
      let visibleCount = 0;

      entries.forEach(entry => {
        const tags = entry.getAttribute('data-tags');
        const entryTags = tags ? tags.split(',').map(t => t.trim().toLowerCase()) : [];
        
        // Show if no filters active, or if entry contains all active tags
        const matches = activeTags.size === 0 || 
                       Array.from(activeTags).every(tag => entryTags.includes(tag));
        
        if (matches) {
          entry.classList.remove('hidden');
          visibleCount++;
        } else {
          entry.classList.add('hidden');
        }
      });

      // Show "no results" message if needed
      let noResultsMsg = document.getElementById('noResults');
      if (visibleCount === 0) {
        if (!noResultsMsg) {
          noResultsMsg = document.createElement('div');
          noResultsMsg.id = 'noResults';
          noResultsMsg.className = 'no-results';
          noResultsMsg.textContent = 'no entries found with those tags';
          entriesContainer.appendChild(noResultsMsg);
        }
      } else {
        if (noResultsMsg) noResultsMsg.remove();
      }
    }

    // Search input listener
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (query) {
        // Split by comma or space for multi-tag search
        const searchTags = query.split(/[,\s]+/).filter(t => t.length > 0);
        activeTags.clear();
        searchTags.forEach(tag => {
          if (allTags.has(tag)) {
            activeTags.add(tag);
          }
        });
      } else {
        activeTags.clear();
      }
      filterEntries();
      renderTags();
    });

    // Initial render
    renderTags();
  </script>

</body>
</html>
