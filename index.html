			<!-- Video fallback & device handling -->
			<script>
			(function(){
				var video = document.getElementById('bg-video');
				var bg = document.getElementById('bg');
				var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
				var saveData = navigator.connection && navigator.connection.saveData;
				var isMobile = /Mobi|Android|iPhone|iPad|iPod/.test(navigator.userAgent) || window.innerWidth < 700;
				if(!video) return;
				if(prefersReduced || saveData || isMobile){
					// disable video on mobile, reduced-motion or save-data
					try{ video.pause(); }catch(e){}
					video.style.display = 'none';
									bg.style.backgroundImage = "url('images/bg.jpg')";
					bg.style.backgroundSize = 'cover';
					bg.style.backgroundPosition = 'center';
				}
				video.addEventListener('error', function(){
					video.style.display = 'none';
									bg.style.backgroundImage = "url('images/bg.jpg')";
				});
			})();
			</script>
