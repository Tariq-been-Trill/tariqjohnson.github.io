<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tariq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --onyx: #08090A;
    --pearl: #EDE9E1;
    --muted: #6E7274;
    --gold: #C6A15B;
    --gold-bright: #E0BE7E;
    --hairline: rgba(237,233,225,0.10);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--onyx);
    overscroll-behavior: none;
  }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    color: var(--pearl);
    padding: 24px;
    cursor: pointer;
  }

  body.done{ cursor: default; }

  .stage{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .line{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .line-row{
    width: 100%;
    max-width: 100%;
    font-size: clamp(20px, 6vw, 30px);
    line-height: 1.4;
    letter-spacing: 0.01em;
    white-space: normal;
    text-align: center;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .line-row--ar{
    font-family: 'Amiri', serif;
    font-size: clamp(19px, 5.6vw, 27px);
    line-height: 1.9;
    direction: rtl;
    transition: opacity 0.4s ease, max-height 0.4s ease, margin 0.4s ease;
    max-height: 60px;
    overflow: hidden;
  }

  .line-row--ar.empty{ opacity: 0; max-height: 0; }

  .dot{ display: inline-block; }
  .dot.blink{ animation: blink 1.1s steps(1) infinite; }

  @keyframes blink{
    0%, 45%{ opacity: 1; }
    46%, 100%{ opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .dot.blink{ animation: none; opacity: 1; }
  }

  /* ---------- "(click)" hint ---------- */

  .click-hint{
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #FFFFFF;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }

  .click-hint.visible{ opacity: 1; }

  /* ---------- Link table ---------- */

  .table{
    width: 100%;
    margin-top: 40px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    border-top: 1px solid var(--hairline);
    pointer-events: none;
  }

  .table.visible{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .row{
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--pearl);
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s ease;
  }

  .row:active{ color: var(--gold-bright); }

  .row-label{
    font-size: 15px;
    letter-spacing: 0.01em;
    min-height: 1.3em;
  }

  .row-value{
    font-size: 12px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.4s ease;
    white-space: nowrap;
  }

  .row-value.shown{ opacity: 1; }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  /* ---------- Bottom tagline sequence ---------- */

  .bottom-line{
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    font-size: 17px;
    letter-spacing: 0.02em;
    color: #FFFFFF;
    white-space: pre;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    padding: 12px 24px;
    text-align: center;
    pointer-events: none;
  }

  .bottom-line.visible{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    cursor: pointer;
  }

  .bottom-line.busy{ cursor: default; }

  /* ---------- Latest post reveal ---------- */

  .void-text{
    width: 100%;
    margin: 0;
    text-align: center;
    font-size: clamp(15px, 4.2vw, 18px);
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .void-date{
    margin-top: 1.6em;
    font-size: 12px;
    color: var(--muted);
    min-height: 1.4em;
  }

  .archive-link{
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: #FFFFFF;
    text-decoration: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    pointer-events: none;
  }

  .archive-link.visible{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
</style>
</head>
<body id="body">

  <div class="stage">
    <div class="line" id="topLine">
      <div class="line-row" id="lineRow1"><span id="prefix"></span><span class="dot blink" id="dot">.</span></div>
      <div class="line-row line-row--ar" id="lineRow2" lang="ar"></div>
    </div>

    <nav class="table" id="table" aria-label="Links">
      <a class="row" href="https://tariqandco.jewelry" target="_blank" rel="noopener">
        <span class="row-label" id="row-0"></span>
        <span class="row-value" id="val-0">tariqandco.jewelry</span>
        <span class="sr-only">Tariq &amp; Co. Jewelry</span>
      </a>
      <a class="row" href="https://onyxstudios.xyz" target="_blank" rel="noopener">
        <span class="row-label" id="row-1"></span>
        <span class="row-value" id="val-1">onyxstudios.xyz</span>
        <span class="sr-only">Onyx Studios</span>
      </a>
      <a class="row" href="mailto:tariqjohnson@tuta.io">
        <span class="row-label" id="row-2"></span>
        <span class="row-value" id="val-2">tariqjohnson@tuta.io</span>
        <span class="sr-only">Email</span>
      </a>
      <a class="row" href="https://www.instagram.com/tariq.been.trill/" target="_blank" rel="noopener">
        <span class="row-label" id="row-3"></span>
        <span class="row-value" id="val-3">@tariq</span>
        <span class="sr-only">Instagram</span>
      </a>
      <a class="row" href="https://www.tiktok.com/@tariqbeentrill" target="_blank" rel="noopener">
        <span class="row-label" id="row-4"></span>
        <span class="row-value" id="val-4">@tariq</span>
        <span class="sr-only">Tiktok</span>
      </a>
      <a class="row" href="https://www.youtube.com/@Tariqandco" target="_blank" rel="noopener">
        <span class="row-label" id="row-5"></span>
        <span class="row-value" id="val-5">watch</span>
        <span class="sr-only">Youtube</span>
      </a>
    </nav>

    <div class="void-text" id="voidText"></div>
    <div class="void-date" id="voidDate"></div>
  </div>

  <div class="click-hint" id="clickHint">(click)</div>

  <div class="bottom-line" id="bottomLine" role="button" tabindex="0">
    <span id="bottomPrefix"></span><span class="dot blink" id="bottomDot">.</span>
  </div>

  <a class="archive-link" id="archiveLink" href="blog.html">Enter the Void</a>

<script src="posts.js"></script>
<script>
  const body = document.getElementById('body');
  const prefix = document.getElementById('prefix');
  const dot = document.getElementById('dot');
  const lineRow2 = document.getElementById('lineRow2');
  const table = document.getElementById('table');
  const clickHint = document.getElementById('clickHint');
  const voidText = document.getElementById('voidText');
  const voidDate = document.getElementById('voidDate');

  const rowLabels = ["Jewelry", "Studio", "Email", "Instagram", "Tiktok", "Youtube"];

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function typeInto(el, text, speed){
    for (let i = 0; i < text.length; i++){
      el.textContent += text[i];
      await sleep(speed);
    }
  }

  async function deleteFrom(el, speed){
    while (el.textContent.length){
      el.textContent = el.textContent.slice(0, -1);
      await sleep(speed);
    }
  }

  function shuffle(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function nextClick(){
    return new Promise((resolve) => {
      function onClick(){ cleanup(); resolve(); }
      function onKey(e){ if (e.key === 'Enter' || e.key === ' ') { cleanup(); resolve(); } }
      function cleanup(){
        body.removeEventListener('click', onClick);
        document.removeEventListener('keydown', onKey);
      }
      body.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);
    });
  }

  function wrapChars(el){
    const text = el.textContent;
    el.textContent = '';
    return [...text].map((ch) => {
      const s = document.createElement('span');
      s.textContent = ch;
      s.style.display = 'inline-block';
      s.style.transition = 'opacity 0.15s ease';
      el.appendChild(s);
      return s;
    });
  }

  async function randomDelete(spans, keepSpans, speed){
    const keep = new Set(keepSpans);
    const removable = shuffle(spans.filter((s) => !keep.has(s)));
    for (const s of removable){
      s.style.opacity = '0';
      s.style.width = '0';
      s.style.overflow = 'hidden';
      await sleep(speed + Math.random() * speed);
    }
  }

  async function randomFillRow(index){
    const el = document.getElementById('row-' + index);
    const val = document.getElementById('val-' + index);
    el.textContent = rowLabels[index];
    const spans = wrapChars(el);
    spans.forEach((s) => { s.style.opacity = '0'; });
    const order = shuffle(spans.map((_, i) => i));
    for (const i of order){
      spans[i].style.opacity = '1';
      await sleep(35 + Math.random() * 55);
    }
    val.classList.add('shown');
  }

  async function deleteSpansSequential(container, speed){
    const spans = Array.from(container.children);
    for (let i = spans.length - 1; i >= 0; i--){
      spans[i].style.opacity = '0';
      spans[i].style.width = '0';
      spans[i].style.overflow = 'hidden';
      await sleep(speed);
    }
    container.textContent = '';
  }

  async function deleteRowChars(index){
    const el = document.getElementById('row-' + index);
    const val = document.getElementById('val-' + index);
    val.classList.remove('shown');
    await deleteSpansSequential(el, 22 + Math.random() * 12);
  }

  const arabicLine = "\u0627\u0644\u0633\u0644\u0627\u0645 \u0639\u0644\u064A\u0643\u0645 \u0648\u0631\u062D\u0645\u0629 \u0627\u0644\u0644\u0647 \u0648\u0628\u0631\u0643\u0627\u062A\u0647";

  // One blink of the dot (animation cycle is 1.1s).
  const ONE_BLINK = 1100;

  async function play(){
    // Stage 0: dot blinks, "(click)" tells people to interact.
    // "(click)" appears once, only if the dot has blinked 6 times untouched.
    const hintTimer = setTimeout(() => clickHint.classList.add('visible'), 6 * ONE_BLINK);
    await nextClick();
    clearTimeout(hintTimer);
    clickHint.classList.remove('visible');
    dot.classList.remove('blink');

    await typeInto(prefix, "Ciao", 95);
    await sleep(650);
    await deleteFrom(prefix, 60);
    await sleep(280);

    await Promise.all([
      typeInto(prefix, "I'm Tariq Johnson", 65),
      typeInto(lineRow2, arabicLine, 65)
    ]);

    // Dot blinks again, waiting for the next click.
    dot.classList.add('blink');
    await nextClick();
    dot.classList.remove('blink');

    const line1Spans = wrapChars(prefix);
    const line2Spans = wrapChars(lineRow2);
    const fullText = "I'm Tariq Johnson";
    const keepStart = fullText.indexOf("Tariq");
    const keepSpans = line1Spans.slice(keepStart, keepStart + 5);
    const allDeletable = [...line1Spans, dot, ...line2Spans];

    await randomDelete(allDeletable, keepSpans, 35);
    lineRow2.classList.add('empty');

    table.classList.add('visible');
    await Promise.all(rowLabels.map((_, i) => randomFillRow(i)));

    body.classList.add('done');

    await sleep(500);
    bottomLine.classList.add('visible');
  }

  play();

  // ---------- Bottom tagline sequence: one click, plays out on its own ----------

  const bottomLine = document.getElementById('bottomLine');
  const bottomPrefix = document.getElementById('bottomPrefix');
  const bottomDot = document.getElementById('bottomDot');
  const archiveLink = document.getElementById('archiveLink');

  const taglines = ["Visual Artist", "Curator", "Digital Architect", "the void"];
  let bottomState = 'idle'; // idle -> running -> void -> gone

  async function runTaglines(){
    bottomState = 'running';
    bottomLine.classList.add('busy');

    for (let i = 0; i < taglines.length; i++){
      bottomDot.classList.remove('blink');
      if (bottomPrefix.textContent) await deleteFrom(bottomPrefix, 55);
      await typeInto(bottomPrefix, taglines[i], 85);

      // The dot blinks once, then the next word begins on the second blink.
      bottomDot.classList.add('blink');
      if (i < taglines.length - 1) await sleep(ONE_BLINK);
    }

    // "the void" stays with its dot blinking, waiting for the click.
    bottomState = 'void';
    bottomLine.classList.remove('busy');
  }

  function onBottomActivate(e){
    e.preventDefault();
    e.stopPropagation();
    if (bottomState === 'idle') runTaglines();
    else if (bottomState === 'void'){ bottomState = 'gone'; enterVoidPhase(); }
  }

  bottomLine.addEventListener('click', onBottomActivate);
  bottomLine.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') onBottomActivate(e);
  });

  // ---------- Phase two: the void collapses, newest post is revealed ----------

  function latestPost(){
    const list = (window.POSTS || []).slice().sort((a, b) => b.date.localeCompare(a.date));
    return list[0];
  }

  function prettyDate(iso){
    const months = ["january","february","march","april","may","june","july","august","september","october","november","december"];
    const [y, m, d] = iso.split('-').map(Number);
    return `${months[m - 1]} ${d}, ${y}`;
  }

  async function enterVoidPhase(){
    bottomDot.classList.remove('blink');
    await deleteFrom(bottomPrefix, 45);
    bottomDot.textContent = '';
    bottomLine.classList.remove('visible');
    bottomLine.style.pointerEvents = 'none';

    // The whole page collapses: every link row, then "Tariq".
    await Promise.all(rowLabels.map((_, i) => deleteRowChars(i)));
    table.classList.remove('visible');
    table.style.display = 'none';
    await deleteSpansSequential(prefix, 70);

    // The dot returns, blinks once, then the post plays.
    dot.style.opacity = '';
    dot.style.width = '';
    dot.style.overflow = '';
    dot.textContent = '.';
    dot.classList.add('blink');
    await sleep(ONE_BLINK);
    dot.classList.remove('blink');

    // The dot becomes the question mark this sentence ends on.
    dot.textContent = '?';
    await typeInto(prefix, "will we see each other again", 55);

    // The "?" blinks until the visitor clicks it.
    dot.classList.add('blink');
    await nextClick();
    dot.classList.remove('blink');

    // Collapse: the sentence deletes, then the "?" goes with it.
    await deleteFrom(prefix, 40);
    dot.textContent = '';

    // Rebuild: closing line, with the date beneath it.
    lineRow2.classList.remove('empty', 'line-row--ar');
    lineRow2.removeAttribute('dir');
    lineRow2.removeAttribute('lang');
    lineRow2.style.marginTop = '1.6em';
    lineRow2.textContent = '';

    await Promise.all([
      typeInto(prefix, "it is what it is", 55),
      (async () => {
        await sleep(650);
        await typeInto(lineRow2, "Sept 5th, 2026", 100);
      })()
    ]);

    await sleep(700);
    archiveLink.classList.add('visible');
  }
</script>

</body>
</html>
